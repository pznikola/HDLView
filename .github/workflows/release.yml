name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: bash tools/package-linux.sh
      - run: python3 tools/smoke-package.py
      - run: gh release upload "$GITHUB_REF_NAME" target/packages/*.deb --clobber
  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run package -- --bundles nsis
      - run: cargo build --locked --release -p hdlview
      - run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/nsis/*.exe target/release/hdlview.exe --clobber
