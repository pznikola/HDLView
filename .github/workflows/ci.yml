name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude hdlview-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude hdlview-desktop
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: cargo test --no-fail-fast --workspace --exclude hdlview-desktop
      - run: npm test
      - run: npm run package
      - run: python tools/check-windows-installer.py target/release/bundle/nsis/*-setup.exe
      # The runner cannot run Linux containers; the CLI must still report why.
      - run: >-
          cargo run --locked --release -p hdlview -- --store "$RUNNER_TEMP/store"
          --profile tools/profiles/docker.json probe | python -c
          "import json, sys; s = json.load(sys.stdin)['status']['state']; print(s);
          sys.exit(s not in ('docker_missing', 'docker_stopped', 'image_missing'))"
      - uses: actions/upload-artifact@v4
        with:
          name: hdlview-windows-setup
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 14
