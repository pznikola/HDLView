name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude hdlview-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude hdlview-desktop
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: cargo test --workspace --exclude hdlview-desktop
      - run: npm test
      - run: npm run build
      - run: cargo check -p hdlview-desktop
